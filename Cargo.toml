[workspace]
members = [
    "crates/nexus-abi",
    "crates/nexus-addon-api",
    "crates/nexus-addon-backend",
    "crates/nexus-addon-cleanup",
    "crates/nexus-addon-ffi",
    "crates/nexus-addon-loader",
    "crates/nexus-addon-watch",
    "crates/nexus-addon-manager",
    "crates/nexus-control",
    "crates/nexus-core",
    "crates/nexus-data-services",
    "crates/nexus-dxgi",
    "crates/nexus-gw2",
    "crates/nexus-hook",
    "crates/nexus-host",
    "crates/nexus-imgui-compat",
    "crates/nexus-imgui-d3d11",
    "crates/nexus-imgui-runtime",
    "crates/nexus-imgui-win32",
    "crates/nexus-inline-hooks",
    "crates/nexus-input",
    "crates/nexus-input-win32",
    "crates/nexus-network",
    "crates/nexus-network-winhttp",
    "crates/nexus-native-memory",
    "crates/nexus-overlay",
    "crates/nexus-platform",
    "crates/nexus-render",
    "crates/nexus-render-d3d11",
    "crates/nexus-runtime",
    "crates/nexus-textures",
    "crates/nexus-textures-d3d11",
    "crates/nexus-ui-fonts",
    "crates/nexus-ui-host",
    "crates/nexus-ui-imgui",
    "crates/nexus-ui-services",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/special-place-ai-heaven/Nexus-Rust"

[workspace.dependencies]
imgui-sys = "=0.7.0"
nexus-abi = { path = "crates/nexus-abi" }
nexus-addon-api = { path = "crates/nexus-addon-api" }
nexus-addon-backend = { path = "crates/nexus-addon-backend" }
nexus-addon-cleanup = { path = "crates/nexus-addon-cleanup" }
nexus-addon-ffi = { path = "crates/nexus-addon-ffi" }
nexus-addon-watch = { path = "crates/nexus-addon-watch" }
nexus-control = { path = "crates/nexus-control" }
nexus-core = { path = "crates/nexus-core" }
nexus-data-services = { path = "crates/nexus-data-services" }
nexus-dxgi = { path = "crates/nexus-dxgi" }
nexus-gw2 = { path = "crates/nexus-gw2" }
nexus-host = { path = "crates/nexus-host" }
nexus-imgui-compat = { path = "crates/nexus-imgui-compat" }
nexus-imgui-runtime = { path = "crates/nexus-imgui-runtime" }
nexus-inline-hooks = { path = "crates/nexus-inline-hooks" }
nexus-input = { path = "crates/nexus-input" }
nexus-input-win32 = { path = "crates/nexus-input-win32" }
nexus-network = { path = "crates/nexus-network" }
nexus-network-winhttp = { path = "crates/nexus-network-winhttp" }
nexus-native-memory = { path = "crates/nexus-native-memory" }
nexus-overlay = { path = "crates/nexus-overlay" }
nexus-platform = { path = "crates/nexus-platform" }
nexus-render = { path = "crates/nexus-render" }
nexus-textures = { path = "crates/nexus-textures" }
nexus-textures-d3d11 = { path = "crates/nexus-textures-d3d11" }
nexus-ui-fonts = { path = "crates/nexus-ui-fonts" }
nexus-ui-host = { path = "crates/nexus-ui-host" }
nexus-ui-imgui = { path = "crates/nexus-ui-imgui" }
nexus-ui-services = { path = "crates/nexus-ui-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
windows-sys = "0.61.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
