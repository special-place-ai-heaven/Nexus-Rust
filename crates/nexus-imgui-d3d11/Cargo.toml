[package]
name = "nexus-imgui-d3d11"
description = "Dear ImGui 1.80 renderer with exhaustive D3D11 state restoration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-imgui-compat = { path = "../nexus-imgui-compat" }
nexus-imgui-runtime = { path = "../nexus-imgui-runtime" }
nexus-render-d3d11 = { path = "../nexus-render-d3d11" }
thiserror = "=2.0.18"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
